name: CI

on:
  push:
    branches: [ main, part2-api, part3-mvc ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build API + MVC and run unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RaceDay.sln

      - name: Build the API
        run: dotnet build src/RaceDay.Api/RaceDay.Api.csproj --no-restore --configuration Release

      - name: Build the MVC web application
        run: dotnet build src/RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test RaceDay.sln --configuration Release --verbosity normal

  docker-build:
    name: Build the Docker images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build the MVC image
        run: docker build -t raceday-web .

      - name: Build the API image
        run: docker build -f Dockerfile.api -t raceday-api .
